<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="混雑" />
    <title>混雑チェッカー</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>混雑チェッカー</h1>
      <button id="favBtn" class="icon-btn" aria-label="お気に入り">★</button>
    </header>

    <main>
      <section class="search">
        <input id="q" type="search" inputmode="search" placeholder="店名・スポットを検索" autocomplete="off" />
        <ul id="suggest" class="suggest" hidden></ul>
      </section>

      <section id="favorites" class="favorites" hidden>
        <h2>お気に入り</h2>
        <ul id="favList" class="fav-list"></ul>
      </section>

      <section id="result" class="result" hidden>
        <div class="result-head">
          <h2 id="spotName"></h2>
          <button id="toggleFav" class="ghost-btn">お気に入り追加</button>
        </div>

        <div class="meter">
          <div id="meterLabel" class="meter-label"></div>
          <div class="bars" role="img" aria-label="混雑度">
            <span class="bar" data-i="1"></span>
            <span class="bar" data-i="2"></span>
            <span class="bar" data-i="3"></span>
            <span class="bar" data-i="4"></span>
          </div>
        </div>

        <div class="meta">
          <div><span class="k">信頼度</span><span id="confidence" class="v"></span></div>
          <div><span class="k">最終更新</span><span id="updated" class="v"></span></div>
          <div><span class="k">サンプル</span><span id="samples" class="v"></span></div>
        </div>

        <h3 class="trend-title">12時間トレンド</h3>
        <div id="trend" class="trend" aria-label="12時間の混雑トレンド"></div>
        <div id="trendLabels" class="trend-labels" aria-hidden="true"></div>
      </section>

      <section id="empty" class="empty">
        <p>検索ボックスにスポット名を入力してください。</p>
        <p class="hint">例: 渋谷スクランブル交差点 / 新宿駅南口 / 原宿カフェ</p>
      </section>
    </main>

    <script src="/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
